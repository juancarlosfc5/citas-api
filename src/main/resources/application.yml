spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:citas_fcv_training}
    username: ${DB_USER:citas_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
server:
  error:
    include-message: never
app:
  jwt:
    issuer: citas-api
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  cookie:
    secure: ${REFRESH_COOKIE_SECURE:true}
    same-site: ${REFRESH_COOKIE_SAME_SITE:None}
  n8n:
    status-webhook:
      enabled: ${N8N_STATUS_WEBHOOK_ENABLED:false}
      url: ${N8N_STATUS_WEBHOOK_URL:}
      bearer-token: ${N8N_STATUS_WEBHOOK_BEARER_TOKEN:}
      connect-timeout-ms: ${N8N_STATUS_WEBHOOK_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${N8N_STATUS_WEBHOOK_READ_TIMEOUT_MS:5000}
